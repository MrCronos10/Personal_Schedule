<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Seal book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=Ma+Shan+Zheng&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#E8D29A}a:hover{color:#FAF6EC}
.tile{background:#F6EEDC;border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;border:0;font:inherit;color:#1C1A17}
.seal{width:50px;height:50px;background:#C8382E;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#FAF6EC;font-family:'Ma Shan Zheng',serif;font-size:22px;line-height:1;box-shadow:inset 0 0 0 3px #C8382E,inset 0 0 0 4.5px rgba(250,246,236,.7)}
.locked{background:transparent;border:2px dashed #B9B1A2;color:#9A9184;box-shadow:none;box-sizing:border-box}
.rare{outline:3px solid #B08A2E;outline-offset:4px;border-radius:5px}
.nm{font-size:13px;font-weight:700}
.sub{font-size:10.5px;color:#6B655C;line-height:1.3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A1F1A; color: #FAF6EC; font-family: 'Noto Sans SC', sans-serif">

  <div style="padding: 54px 12px 0; display: flex; align-items: center">
    <a href="Progress.dc.html" aria-label="返回进度" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FAF6EC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>

  <div style="padding: 0 20px">
    <div style="display: flex; align-items: flex-end; gap: 12px">
      <div style="flex: 1">
        <div style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 32px; line-height: 1.1">印章册</div>
        <div style="margin-top: 6px; font-size: 13px; color: #CFC6B4">读出来的印章，永远不会失去。</div>
      </div>
      <div style="text-align: right"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 30px; color: #E8D29A">7</span><span style="font-family: 'IBM Plex Mono', monospace; color: #9A8F7E"> / 24</span></div>
    </div>

    <div style="margin-top: 18px; background: #3A2D25; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px">
      <div class="seal locked" style="width: 52px; height: 52px; font-size: 17px; border-color: #8E7F6C; color: #CFC6B4; flex: none">五十篇</div>
      <div style="flex: 1">
        <div style="font-size: 12px; letter-spacing: 1px; color: #D9B866">下一枚</div>
        <div style="font-size: 15px; font-weight: 700">五十篇 · 读完 50 篇文章</div>
        <div style="margin-top: 8px; height: 6px; border-radius: 3px; background: #2A1F1A"><div style="width: 64%; height: 6px; border-radius: 3px; background: #C8382E"></div></div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #CFC6B4">32/50</div>
    </div>

    <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button class="tile"><div class="seal" style="transform: rotate(-5deg); font-size: 21px">初读</div><div class="nm">初读</div><div class="sub">第一篇文章<br>3月2日</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(4deg); font-size: 21px">十篇</div><div class="nm">十篇</div><div class="sub">读完 10 篇<br>今天</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(-3deg); font-size: 21px">百词</div><div class="nm">百词</div><div class="sub">认识 100 个词<br>9月18日</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(5deg); font-size: 21px">识途</div><div class="nm">识途</div><div class="sub">读懂一张真的<br>菜单或路牌</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(-4deg); background: #8B2A1F; box-shadow: inset 0 0 0 3px #8B2A1F, inset 0 0 0 4.5px rgba(250,246,236,.7); font-size: 21px">夜读</div><div class="nm">夜读</div><div class="sub">晚上十点后<br>读完一篇</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(3deg); font-size: 21px">农家</div><div class="nm">农家</div><div class="sub">认识 25 个<br>农业词</div></button>
      <button class="tile"><div class="seal" style="transform: rotate(-2deg); font-size: 21px">问字</div><div class="nm">问字</div><div class="sub">写下第一条<br>词记</div></button>
      <button class="tile" style="background: #EFE6D2"><div class="seal locked" style="font-size: 20px">半程</div><div class="nm" style="color: #6B655C">半程</div><div class="sub">HSK 4 认识 300<br><span style="font-family: 'IBM Plex Mono', monospace">128/300</span></div></button>
      <button class="tile" style="background: #EFE6D2"><div class="seal locked rare" style="font-size: 20px">过关</div><div class="nm" style="color: #6B655C">过关 · 稀有</div><div class="sub">HSK 4 认识<br>五分之四</div></button>
      <button class="tile" style="background: #EFE6D2"><div class="seal locked" style="font-size: 20px">百日</div><div class="nm" style="color: #6B655C">百日</div><div class="sub">100 个有完成的日子<br><span style="font-family: 'IBM Plex Mono', monospace">61/100</span> · 不必连续</div></button>
      <button class="tile" style="background: #EFE6D2"><div class="seal locked rare" style="font-size: 15px">千字文</div><div class="nm" style="color: #6B655C">千字文 · 稀有</div><div class="sub">一共认识<br>1000 个词</div></button>
      <button class="tile" style="background: #EFE6D2"><div class="seal locked" style="font-size: 20px">？</div><div class="nm" style="color: #6B655C">隐藏印章</div><div class="sub">读着读着<br>就会出现</div></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
